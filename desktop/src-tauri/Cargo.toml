[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["fs"] }
flate2 = "1.1.9"
tar = "0.4.46"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
chrono = "0.4.45"
futures-util = "0.3.33"
keyring-core = "1.0.0"
tower = { version = "0.5.3", features = ["util"] }
percent-encoding = "2.3.2"
filetime = "0.2.29"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
rustls = { version = "0.23.42", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1.0.9"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.22.4"
ndk-context = "0.1.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain", "protected"] }

