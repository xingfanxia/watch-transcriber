<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX语音Vault</title>
<style>
  :root {
    /* Codex-style warm graphite: neutral (not blue-tinted) dark, hierarchy by
       lightness steps, one soft-blue accent for links/active only.
       --amber/--amber-deep are legacy token names, now the accent pair. */
    --bg: #1a1a1a; --panel: #232323; --panel-2: #2c2c2c; --line: #343434;
    --ink: #ececec; --dim: #a8a8a8; --faint: #8a8a8a; --tick: #4a4a4a;
    --amber: #6cb0f5; --amber-deep: #4a90d9; --glow: rgba(108,176,245,.13);
    --serif: "PingFang SC", -apple-system, "Helvetica Neue", sans-serif;
    --sans: "PingFang SC", -apple-system, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f7f7f7; --panel-2: #ececec; --line: #e2e2e2;
      --ink: #242424; --dim: #6e6e6e; --faint: #9a9a9a; --tick: #cfcfcf;
      --amber: #2f7fd6; --amber-deep: #559ce3; --glow: rgba(47,127,214,.12);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; line-height: 1.6; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 2px; }

  .app { display: grid; grid-template-columns: 208px minmax(340px, 1fr) minmax(0, 1.2fr); height: 100%; }

  /* ---------- sidebar ---------- */
  .side { border-right: 1px solid var(--line); padding: 22px 18px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  .brand h1 { font-family: var(--serif); font-size: 22px; font-weight: 900; letter-spacing: .04em; }
  .brand .sub { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 4px; letter-spacing: .02em; }
  .search input {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    color: var(--ink); font: 13px var(--sans); padding: 7px 11px;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: none; border-color: var(--amber-deep); }
  .cats { display: flex; flex-direction: column; gap: 2px; }
  .cat {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 10px; border-radius: 6px; color: var(--dim); text-align: left;
  }
  .cat:hover { background: var(--panel); color: var(--ink); }
  .cat.on { background: var(--panel-2); color: var(--ink); }
  .cat.on .n { color: var(--amber); }
  .cat .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .stats { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px;
           font-family: var(--mono); font-size: 11px; color: var(--faint); line-height: 2; }
  .stats b { color: var(--dim); font-weight: 400; }

  /* ---------- list ---------- */
  .list { overflow-y: auto; border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .day { padding: 18px 22px 8px; position: sticky; top: 0; background: var(--bg);
         font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .08em;
         display: flex; align-items: center; justify-content: space-between; gap: 14px;
         border-bottom: 1px solid var(--line); }
  .day-sum { color: var(--dim); letter-spacing: .02em; }
  .row { display: block; width: 100%; text-align: left; padding: 12px 22px; border-left: 2px solid transparent; }
  .row:hover { background: var(--panel); }
  .row.on { background: var(--panel-2); border-left-color: var(--amber); }
  .row-top { display: flex; align-items: baseline; gap: 10px; }
  .row .t { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .row .ti { font-family: var(--serif); font-size: 15px; font-weight: 700; flex: 1;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.on .ti { color: var(--ink); }
  .avatar { display: inline-grid; place-items: center; width: 19px; height: 19px;
            border-radius: 50%; border: 1px solid; font-size: 9.5px; font-weight: 600;
            flex: none; box-sizing: border-box; }
  .avatar.unk { color: var(--faint); background: none; border: 1px dashed var(--faint); }
  .facepile { display: inline-flex; flex: none; }
  .facepile .avatar { margin-left: -7px; box-shadow: 0 0 0 2px var(--bg); transition: margin-left .15s ease; }
  .facepile .avatar:first-child { margin-left: 0; }
  .row:hover .facepile .avatar, .row.on .facepile .avatar { margin-left: 2px; }
  .row:hover .facepile .avatar:first-child, .row.on .facepile .avatar:first-child { margin-left: 0; }
  .cat-l { display: inline-flex; align-items: center; gap: 8px; }
  .cat .avatar { cursor: pointer; position: relative; }
  .color-in { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; height: 100%; }
  .cat.spk { padding-top: 5px; padding-bottom: 5px; }
  .row .dur { font-size: 11.5px; flex: none; }
  .row .dur.short { color: var(--faint); }
  .row .dur.mid { color: var(--dim); }
  .row .dur.long { color: var(--ink); font-weight: 500; }
  .row .noaudio { font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .empty { padding: 60px 24px; color: var(--faint); text-align: center; font-size: 13px; }

  /* ---------- detail ---------- */
  .detail { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .detail-pad { padding: 26px 30px 60px; }
  .placeholder { height: 100%; display: grid; place-items: center; color: var(--faint); font-size: 13px; }
  .d-cat { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: .12em; }
  .d-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .del-btn { font-size: 11.5px; color: var(--faint); border: 1px solid var(--line);
             border-radius: 8px; padding: 3px 10px; flex: none; }
  .del-btn:hover { color: #e5534b; border-color: #e5534b; }
  .del-btn.armed { color: #fff; background: #c93c34; border-color: #c93c34; }
  .d-title { font-family: var(--serif); font-size: 24px; font-weight: 900; line-height: 1.35; margin: 6px 0 4px; }
  .d-meta { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-bottom: 18px; }
  .player { display: flex; align-items: center; gap: 12px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
            position: sticky; top: 14px; z-index: 2; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .play-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--amber); color: #fff;
              display: grid; place-items: center; font-size: 13px; flex: none; }
  .play-btn:hover { filter: brightness(1.1); }
  .seek { flex: 1; height: 4px; background: var(--panel-2); border-radius: 2px; position: relative; cursor: pointer; }
  .seek .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); border-radius: 2px; }
  .ptime { font-family: var(--mono); font-size: 11px; color: var(--dim); flex: none; }
  .side-sec { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .12em;
              margin: 14px 0 2px; padding: 0 10px; }
  .spk-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .spk-chip { display: flex; gap: 6px; align-items: baseline; background: var(--panel);
              border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
              font-size: 12px; color: var(--dim); }
  .spk-chip.named { color: var(--ink); border-color: var(--amber-deep); }
  .spk-chip:not(:disabled):hover { border-color: var(--amber); color: var(--ink); }
  .spk-chip .sp-slot { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .spk-pop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel);
             border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .spk-quick { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spk-quick .spk-hint { flex-basis: auto; }
  .spk-name-pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
                   padding: 5px 16px; font-size: 13px; color: var(--ink); }
  .spk-name-pill:hover { border-color: var(--amber); color: var(--amber); }
  .spk-name-pill.on { border-color: var(--amber-deep); color: var(--amber); }
  .spk-pop input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                   color: var(--ink); font: 13px var(--sans); padding: 6px 10px; min-width: 200px; }
  .spk-pop input:focus { outline: none; border-color: var(--amber-deep); }
  .spk-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
             padding: 6px 12px; font-size: 12px; }
  .spk-btn:hover { border-color: var(--amber); color: var(--amber); }
  .spk-hint { flex-basis: 100%; font-size: 11px; color: var(--faint); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; }
  .tab { padding: 8px 16px; font-size: 13px; color: var(--dim); border-bottom: 2px solid transparent;
         margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--amber); }
  .tab-body { min-height: 120px; }
  .att { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
         margin: 10px 0; overflow: hidden; }
  .att summary { cursor: pointer; padding: 10px 16px; font-size: 13px; color: var(--dim); }
  .att[open] summary { color: var(--ink); border-bottom: 1px solid var(--line); }
  .att-empty { color: var(--faint); font-size: 12px; }
  .md-body { padding: 6px 18px 16px; font-size: 13.5px; max-width: 72ch; overflow-x: auto; }
  .md-body h1, .md-body h2, .md-body h3 { margin: 16px 0 8px; line-height: 1.4; }
  .md-body h1 { font-size: 17px; } .md-body h2 { font-size: 15px; } .md-body h3 { font-size: 14px; }
  .md-body p, .md-body li { margin: 6px 0; color: var(--ink); }
  .md-body ul, .md-body ol { padding-left: 22px; }
  .md-body code { font-family: var(--mono); font-size: .88em; background: var(--panel-2);
                  padding: 1px 5px; border-radius: 4px; }
  .md-body pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                 padding: 10px 14px; overflow-x: auto; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--dim); margin: 8px 0; }
  .md-body table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .md-body th { background: var(--panel-2); }
  .md-body a { color: var(--amber); }
  .att-editor { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .att-editor .att-name { flex-basis: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); font: 13px var(--sans); padding: 6px 10px; max-width: 320px; }
  .att-editor .att-text { flex-basis: 100%; min-height: 72px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; color: var(--ink);
    font: 12.5px var(--mono); padding: 8px 12px; resize: vertical; }
  .att-editor input:focus, .att-editor textarea:focus { outline: none; border-color: var(--amber-deep); }
  .sec { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .14em; margin: 26px 0 10px; }
  .sec::after { content: ""; display: inline-block; width: 40px; border-bottom: 1px solid var(--line); margin-left: 10px; vertical-align: middle; }
  .d-sum { color: var(--ink); max-width: 62ch; }
  .d-sum + .d-sum { color: var(--dim); margin-top: 10px; }
  .kps { max-width: 62ch; padding-left: 18px; color: var(--dim); }
  .kps li { margin: 4px 0; }
  .todos { max-width: 62ch; list-style: none; }
  .todos li { margin: 4px 0; color: var(--dim); }
  .todos li::before { content: "□ "; color: var(--amber); font-family: var(--mono); }
  .tr { font-family: var(--mono); font-size: 12px; line-height: 1.9; max-width: 76ch; }
  .tr .ln { margin: 2px 0; }
  .tr .ts { color: var(--faint); padding: 0 2px; border-radius: 3px; }
  .tr button.ts:hover { color: var(--amber); background: var(--glow); }
  .tr .sp { color: var(--amber-deep); } /* fallback; per-name color set inline */
  .tr .tx { color: var(--ink); }
  @media (prefers-color-scheme: light) { .player { box-shadow: 0 4px 14px rgba(90,70,30,.12); } }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { display: block; height: auto; }
    .side { border-right: none; border-bottom: 1px solid var(--line); }
    .stats { margin-top: 8px; }
    .list { border-right: none; max-height: 45vh; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .row, .cat, .dial i, .play-btn { transition: background .12s ease, color .12s ease, box-shadow .12s ease; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">
      <h1>AX语音Vault</h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="搜索标题或转写 (/)" aria-label="搜索"></div>
    <div class="cats" id="cats" role="listbox" aria-label="分类"></div>
    <div class="stats" id="stats"></div>
  </nav>
  <main class="list" id="list" aria-label="录音列表"></main>
  <section class="detail" id="detail"><div class="placeholder">选择一条录音开始</div></section>
</div>
<audio id="audio" preload="none"></audio>
<script src="marked.min.js"></script>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const $  = (s, el) => (el || document).querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

const fmtDur = s => {
  if (s == null) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`;
};
/* Human units for list display — "1小时16分" needs no mental conversion. */
const fmtDurCN = s => {
  if (s == null) return "";
  s = Math.round(s);
  if (s < 60) return `${s}秒`;
  const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
  return h ? `${h}小时${m ? m + "分" : ""}` : `${m}分`;
};
const durClass = s => s >= 2700 ? "long" : s >= 600 ? "mid" : "short";

let state = { cat: null, spk: null, q: "", sel: null, tab: "summary" };
/* Editing needs the desktop app's loopback API; file:// stays read-only. */
const CAN_EDIT = location.protocol.startsWith("http");

const slotsOf = e => [...new Set([
  ...((e.transcript || "").match(/SPEAKER[_ ]?\d+/g) || []),
  ...Object.keys(e.speakers || {}),
])];
/* Per-name colors: a curated palette of well-separated hues; each name hashes
   to a slot and collisions probe to the next free one, so speakers on screen
   never share near-identical colors (previously AX/妍子/E姐 all landed in the
   purple-pink band). Deterministic for a given set of names. */
const SPK_HUES = [265, 15, 165, 45, 205, 330, 110, 240, 80, 300];
let _hueMap = null;
const _hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
const spkHue = name => {
  if (!_hueMap || !_hueMap.has(name)) {
    _hueMap = new Map();
    const names = new Set();
    for (const e of DATA.entries) Object.values(e.speakers || {}).forEach(n => names.add(n));
    names.add(name);
    const taken = new Set();
    for (const n of [...names].sort()) {
      let i = _hash(n) % SPK_HUES.length;
      while (taken.has(i) && taken.size < SPK_HUES.length) i = (i + 1) % SPK_HUES.length;
      taken.add(i);
      _hueMap.set(n, SPK_HUES[i]);
    }
  }
  return _hueMap.get(name);
};
const spkColor = (name, alpha) => {
  const custom = (DATA.speaker_colors || {})[name];
  if (custom) return alpha ? `color-mix(in srgb, ${custom} ${alpha * 100}%, transparent)` : custom;
  const light = matchMedia("(prefers-color-scheme: light)").matches;
  return `hsl(${spkHue(name)} 60% ${light ? 38 : 68}%${alpha ? " / " + alpha : ""})`;
};
const avatarEl = name => {
  const a = el("span", "avatar", String(name).slice(0, 1).toUpperCase());
  a.style.color = spkColor(name);
  // Opaque fill (speaker tint composited over the page bg) — translucent
  // fills let stacked neighbours show through each other.
  a.style.background = `color-mix(in srgb, ${spkColor(name)} 20%, var(--bg))`;
  a.style.borderColor = spkColor(name, ".55");
  a.title = name;
  return a;
};
const facepileEl = e => {
  const names = [...new Set(Object.values(e.speakers || {}))];
  const untagged = slotsOf(e).filter(s => !(e.speakers || {})[s]).length;
  if (!names.length && !untagged) return null;
  const pile = el("span", "facepile");
  names.forEach(n => pile.append(avatarEl(n)));
  if (untagged) {
    const q = el("span", "avatar unk", "?");
    q.title = `${untagged} 个说话人未标注`;
    pile.append(q);
  }
  return pile;
};
const speakerNames = () => {
  const names = new Map();
  for (const e of DATA.entries)
    for (const n of Object.values(e.speakers || {}))
      names.set(n, (names.get(n) || 0) + 1);
  return names;
};

/* ---------- sidebar ---------- */
function renderSide() {
  $("#brandSub").textContent = `${DATA.span} · ${DATA.entries.length} 条`;
  const cats = $("#cats"); cats.textContent = "";
  const mk = (label, key, count) => {
    const b = el("button", "cat" + ((state.cat ?? null) === key ? " on" : ""));
    b.setAttribute("role", "option");
    b.append(el("span", null, label), el("span", "n", String(count)));
    b.onclick = () => { state.cat = key; renderSide(); renderList(); };
    cats.append(b);
  };
  mk("全部", null, DATA.entries.length);
  for (const c of DATA.categories) {
    const n = DATA.entries.filter(e => e.category === c).length;
    if (n) mk(c, c, n);
  }
  const names = speakerNames();
  if (names.size) {
    cats.append(el("div", "side-sec", "说话人"));
    const mkSpk = (label, key, count) => {
      const b = el("button", "cat spk" + ((state.spk ?? null) === key ? " on" : ""));
      const left = el("span", "cat-l");
      const av = avatarEl(label);
      if (CAN_EDIT) {
        // Clicking the circle (not the row) opens a native color picker; the
        // custom color persists to data/speakers.json via the loopback API.
        av.title = `${label} — 点击改颜色`;
        const pick = el("input");
        pick.type = "color";
        pick.className = "color-in";
        pick.oninput = () => {
          (DATA.speaker_colors = DATA.speaker_colors || {})[label] = pick.value;
          renderSide(); renderList();
          if (state.sel) select(state.sel);
        };
        pick.onchange = () => {
          fetch("/api/speaker-colors", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: label, color: pick.value }),
          }).catch(() => {});
        };
        av.onclick = ev => { ev.stopPropagation(); pick.click(); };
        av.append(pick);
      }
      left.append(av, el("span", null, label));
      b.append(left, el("span", "n", String(count)));
      b.onclick = () => { state.spk = state.spk === key ? null : key; renderSide(); renderList(); };
      cats.append(b);
    };
    for (const [n, c] of [...names.entries()].sort((a, b) => b[1] - a[1])) mkSpk(n, n, c);
  }
  const total = DATA.entries.reduce((a, e) => a + (e.duration || 0), 0);
  const night = DATA.entries.filter(e => { const h = +e.time.slice(0,2); return h < 8; }).length;
  $("#stats").innerHTML = "";
  $("#stats").append(
    Object.assign(el("div"), {innerHTML: `共 <b>${(total / 3600).toFixed(1)}</b> 小时`}),
    Object.assign(el("div"), {innerHTML: `<b>${Math.round(night / DATA.entries.length * 100)}%</b> 录于凌晨`}),
  );
}

/* ---------- list ---------- */
function visible() {
  const q = state.q.trim().toLowerCase();
  return DATA.entries.filter(e =>
    (!state.cat || e.category === state.cat) &&
    (!state.spk || Object.values(e.speakers || {}).includes(state.spk)) &&
    (!q || e.title.toLowerCase().includes(q) ||
      Object.values(e.speakers || {}).join(" ").toLowerCase().includes(q) ||
      (e.transcript || "").toLowerCase().includes(q)));
}
function renderList() {
  const list = $("#list"); list.textContent = "";
  const items = visible();
  if (!items.length) { list.append(el("div", "empty", "没有匹配的录音 — 换个词或清掉筛选试试")); return; }
  let day = null;
  for (const e of items) {
    if (e.date !== day) {
      day = e.date;
      const todays = items.filter(x => x.date === day);
      const total = todays.reduce((a, x) => a + (x.duration || 0), 0);
      const head = el("div", "day");
      head.append(el("span", null, `${e.date} ${e.weekday}`));
      head.append(el("span", "day-sum",
        `${todays.length} 条${total ? " · " + fmtDurCN(total) : ""}`));
      list.append(head);
    }
    const row = el("button", "row" + (state.sel === e.key ? " on" : ""));
    row.dataset.key = e.key;
    const top = el("div", "row-top");
    top.append(el("span", "t", e.time), el("span", "ti", e.ai_title));
    const pile = facepileEl(e);
    if (pile) top.append(pile);
    if (e.audio) {
      const dur = el("span", "dur " + durClass(e.duration || 0), fmtDurCN(e.duration));
      dur.title = fmtDur(e.duration);
      top.append(dur);
    } else top.append(el("span", "noaudio", "无音频"));
    row.append(top);
    row.onclick = () => select(e.key);
    list.append(row);
  }
}

/* ---------- detail + player ---------- */
const audio = $("#audio");
let playing = null;
function select(key) {
  state.sel = key;
  // Switching to a different recording stops the previous one — otherwise
  // the old audio keeps playing with no visible control to stop it.
  if (playing && playing !== key && !audio.paused) audio.pause();
  const e = DATA.entries.find(x => x.key === key);
  renderList();
  const row = $(`.row[data-key="${CSS.escape(key)}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
  const d = $("#detail"); d.textContent = "";
  const pad = el("div", "detail-pad");

  const head = el("div", "d-head");
  head.append(el("div", "d-cat", e.category));
  if (CAN_EDIT) {
    const del = el("button", "del-btn", "删除");
    del.onclick = () => {
      if (!del.classList.contains("armed")) {
        del.classList.add("armed");
        del.textContent = "确认删除?(笔记+音频+附注)";
        setTimeout(() => { del.classList.remove("armed"); del.textContent = "删除"; }, 4000);
        return;
      }
      del.disabled = true; del.textContent = "删除中…";
      fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: e.key }),
      }).then(r => { if (!r.ok) return r.text().then(t => { throw new Error(t); }); })
        .then(() => {
          DATA.entries = DATA.entries.filter(x => x.key !== e.key);
          state.sel = null;
          $("#detail").textContent = "";
          $("#detail").append(el("div", "placeholder", "已删除"));
          renderSide(); renderList();
        })
        .catch(err => { del.disabled = false; del.textContent = "删除失败: " + err.message.slice(0, 60); });
    };
    head.append(del);
  }
  pad.append(head, el("h2", "d-title", e.ai_title),
             el("div", "d-meta", `${e.date} ${e.time} · ${e.original || "原始文件已删除"}${e.duration ? " · " + fmtDur(e.duration) : ""}`));

  const slots = slotsOf(e);
  if (slots.length) {
    const row = el("div", "spk-row");
    for (const slot of slots) {
      const name = (e.speakers || {})[slot];
      const chip = el("button", "spk-chip" + (name ? " named" : ""));
      const label = el("span", null, name || "未标注");
      if (name) { label.style.color = spkColor(name); chip.style.borderColor = spkColor(name); }
      chip.append(el("span", "sp-slot", slot.replace("SPEAKER_", "S")), label);
      if (CAN_EDIT) chip.onclick = () => openSpeakerEditor(e, slot, chip);
      else chip.disabled = true;
      row.append(chip);
    }
    pad.append(row);
  }

  if (e.audio) pad.append(buildPlayer(e));

  const tabs = el("div", "tabs");
  const body = el("div", "tab-body");
  const defs = [
    ["summary", "摘要"],
    ["attach", `附注${(e.attachments || []).length ? " " + e.attachments.length : ""}`],
    ["transcript", "转写"],
  ];
  const renderTab = () => {
    body.textContent = "";
    tabs.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("on", t.dataset.tab === state.tab));
    if (state.tab === "summary") buildSummaryTab(e, body);
    else if (state.tab === "attach") buildAttachTab(e, body);
    else buildTranscriptTab(e, body);
  };
  for (const [id, label] of defs) {
    const t = el("button", "tab", label);
    t.dataset.tab = id;
    t.onclick = () => { state.tab = id; renderTab(); };
    tabs.append(t);
  }
  pad.append(tabs, body);
  renderTab();
  d.append(pad);
  d.scrollTop = 0;
}

function buildSummaryTab(e, body) {
  if (e.summary_zh) body.append(el("p", "d-sum", e.summary_zh));
  if (e.summary_en) body.append(el("p", "d-sum", e.summary_en));
  if (e.key_points && e.key_points.length) {
    body.append(el("div", "sec", "要点"));
    const ul = el("ul", "kps");
    e.key_points.forEach(k => ul.append(el("li", null, k)));
    body.append(ul);
  }
  if (e.todos && e.todos.length) {
    body.append(el("div", "sec", "待办"));
    const ul = el("ul", "todos");
    e.todos.forEach(k => ul.append(el("li", null, k)));
    body.append(ul);
  }
  if (!e.summary_zh && !e.summary_en && !(e.key_points || []).length && !(e.todos || []).length)
    body.append(el("p", "att-empty", "这条录音没有摘要"));
}

function buildAttachTab(e, body) {
  for (const att of e.attachments || []) {
    const box = el("details", "att");
    if ((e.attachments || []).length === 1) box.open = true;
    box.append(el("summary", null, att.name));
    const md = el("div", "md-body");
    md.innerHTML = window.marked ? marked.parse(att.content) : "";
    if (!window.marked) md.textContent = att.content;
    box.append(md);
    body.append(box);
  }
  if (!(e.attachments || []).length) body.append(el("p", "att-empty", "暂无附注"));
  if (CAN_EDIT) body.append(buildAttachEditor(e));
}

function buildTranscriptTab(e, body) {
  if (e.transcript) body.append(buildTranscript(e));
  else body.append(el("p", "att-empty", "这条录音没有转写"));
}

function buildAttachEditor(e) {
  const box = el("div", "att-editor");
  const name = el("input", "att-name");
  name.placeholder = "附注标题(可选)";
  const ta = el("textarea", "att-text");
  ta.placeholder = "粘贴 markdown…";
  const send = el("button", "spk-btn", "附上");
  const pick = el("button", "spk-btn", "选择 .md 文件");
  const file = el("input"); file.type = "file"; file.accept = ".md,.txt"; file.hidden = true;
  const post = (attName, content) => {
    if (!content.trim()) return;
    fetch("/api/attachments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: e.key, name: attName || "附注", content }),
    }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(res => {
        (e.attachments = e.attachments || []).push({
          name: res.rel.split("/").pop().replace(/\.md$/, ""), rel: res.rel, content,
        });
        select(e.key);
      })
      .catch(err => { ta.placeholder = "保存失败: " + err.message; });
  };
  send.onclick = () => post(name.value.trim(), ta.value);
  pick.onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    f.text().then(txt => post(f.name.replace(/\.(md|txt)$/, ""), txt));
  };
  box.append(name, ta, el("div", "att-actions"), send, pick, file);
  return box;
}

function buildPlayer(e) {
  const box = el("div", "player");
  const btn = el("button", "play-btn", "▶");
  btn.setAttribute("aria-label", "播放");
  const seek = el("div", "seek"), fill = el("div", "fill");
  seek.append(fill);
  const time = el("span", "ptime", "0:00");
  box.append(btn, seek, time);
  const load = () => {
    if (playing !== e.key) { audio.src = e.audio; playing = e.key; }
  };
  btn.onclick = () => { load(); audio.paused ? audio.play() : audio.pause(); };
  seek.onclick = ev => {
    load();
    const r = seek.getBoundingClientRect();
    if (audio.duration) audio.currentTime = (ev.clientX - r.left) / r.width * audio.duration;
  };
  audio.onplay  = () => { if (playing === e.key) { btn.textContent = "⏸"; btn.setAttribute("aria-label", "暂停"); } };
  audio.onpause = () => { if (playing === e.key) { btn.textContent = "▶"; btn.setAttribute("aria-label", "播放"); } };
  audio.ontimeupdate = () => {
    if (playing !== e.key || !audio.duration) return;
    fill.style.width = audio.currentTime / audio.duration * 100 + "%";
    time.textContent = fmtDur(audio.currentTime) + " / " + fmtDur(audio.duration);
  };
  box.seekTo = sec => { load(); audio.currentTime = sec; audio.play(); };
  // Re-opening the entry that's already loaded: restore progress + button
  // state instead of showing a blank 0:00 player.
  if (playing === e.key && audio.duration) {
    fill.style.width = audio.currentTime / audio.duration * 100 + "%";
    time.textContent = fmtDur(audio.currentTime) + " / " + fmtDur(audio.duration);
    if (!audio.paused) { btn.textContent = "⏸"; btn.setAttribute("aria-label", "暂停"); }
  }
  return box;
}

const LINE_RE = /^\[(\d{2}):(\d{2}):(\d{2})[^\]]*\]\s*(SPEAKER[_ ]?\d+|[^:：]{1,20})?[:：]?\s*(.*)$/;
function buildTranscript(e) {
  const box = el("div", "tr");
  for (const raw of e.transcript.split("\n")) {
    if (!raw.trim()) continue;
    const ln = el("div", "ln");
    const m = raw.match(LINE_RE);
    if (m) {
      const sec = (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]);
      const label = raw.slice(0, raw.indexOf("]") + 1);
      let ts;
      if (e.audio) {
        ts = el("button", "ts", label);
        ts.title = "跳到这里播放";
        ts.onclick = () => { const p = $(".player"); if (p && p.seekTo) p.seekTo(sec); };
      } else ts = el("span", "ts", label);
      ln.append(ts);
      if (m[4]) {
        const disp = (e.speakers || {})[m[4]] || m[4];
        const sp = el("span", "sp", " " + disp + ": ");
        sp.style.color = spkColor(disp);
        ln.append(sp);
      } else ln.append(document.createTextNode(" "));
      ln.append(el("span", "tx", m[5] || ""));
    } else ln.append(el("span", "tx", raw));
    box.append(ln);
  }
  return box;
}

/* ---------- speaker tagging (desktop app only) ---------- */
function openSpeakerEditor(e, slot, anchor) {
  document.querySelectorAll(".spk-pop").forEach(p => p.remove());
  const pop = el("div", "spk-pop");
  const current = (e.speakers || {})[slot];
  const known = [...speakerNames().entries()].sort((a, b) => b[1] - a[1]);
  if (known.length) {
    const quick = el("div", "spk-quick");
    quick.append(el("span", "spk-hint", "点击直接标注本条:"));
    for (const [n] of known) {
      const pill = el("button", "spk-name-pill" + (n === current ? " on" : ""), n);
      pill.onclick = () => applySpeakers([e], slot, n, pop);
      quick.append(pill);
    }
    pop.append(quick);
  }
  const input = el("input");
  input.placeholder = known.length ? "或输入新名字,留空=清除标注" : "输入名字,留空=清除标注";
  input.value = (e.speakers || {})[slot] || "";
  const dl = el("datalist"); dl.id = "spk-names";
  for (const n of speakerNames().keys()) { const o = el("option"); o.value = n; dl.append(o); }
  input.setAttribute("list", "spk-names");
  const one = el("button", "spk-btn", "仅本条");
  const n_batch = visible().filter(x => slotsOf(x).includes(slot)).length;
  const batch = el("button", "spk-btn", `应用到当前筛选 ${n_batch} 条`);
  const hint = el("div", "spk-hint",
    `批量 = 当前筛选中所有含 ${slot} 的录音的该槽位;分身份不保证跨录音一致,可随时改回`);
  one.onclick = () => applySpeakers([e], slot, input.value.trim(), pop);
  batch.onclick = () => applySpeakers(visible().filter(x => slotsOf(x).includes(slot)),
                                      slot, input.value.trim(), pop);
  input.onkeydown = ev => { if (ev.key === "Enter") one.click(); if (ev.key === "Escape") pop.remove(); };
  pop.append(input, dl, one, batch, hint);
  anchor.after(pop);
  input.focus();
}

function applySpeakers(targets, slot, name, pop) {
  const updates = targets.map(t => ({ key: t.key, speakers: { [slot]: name } }));
  fetch("/api/speakers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updates }),
  }).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    for (const t of targets) {
      t.speakers = t.speakers || {};
      if (name) t.speakers[slot] = name; else delete t.speakers[slot];
    }
    pop.remove();
    renderSide(); renderList();
    if (state.sel) select(state.sel);
  }).catch(err => { pop.querySelector(".spk-hint").textContent = `保存失败: ${err.message}`; });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") { if (ev.key === "Escape") { ev.target.value = ""; state.q = ""; renderList(); ev.target.blur(); } return; }
  if (ev.key === "/") { ev.preventDefault(); $("#q").focus(); return; }
  if (ev.key === " " && state.sel) { ev.preventDefault(); const p = $(".play-btn"); if (p) p.click(); return; }
  if ("123".includes(ev.key) && state.sel) {
    state.tab = ["summary", "attach", "transcript"][+ev.key - 1];
    select(state.sel);
    return;
  }
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    const items = visible(); if (!items.length) return;
    let i = items.findIndex(x => x.key === state.sel);
    i = ev.key === "ArrowDown" ? Math.min(i + 1, items.length - 1) : Math.max(i - 1, 0);
    select(items[i].key);
  }
});
$("#q").addEventListener("input", ev => { state.q = ev.target.value; renderList(); });

/* Live sync with the archive (http only — the desktop app; file:// can't
   fetch). Speaker/category changes merge in place with no page reload — a
   full reload (which loses scroll/selection) happens only when the entry
   count changes, i.e. the pipeline delivered a new recording. */
if (location.protocol.startsWith("http")) {
  const sync = () => fetch("manifest.json", { cache: "no-store" })
    .then(r => r.json())
    .then(man => {
      if (Object.keys(man).length !== DATA.entries.length) { location.reload(); return; }
      let dirty = false;
      for (const e of DATA.entries) {
        const src = man[e.key];
        if (!src) continue;
        const spk = src.speakers || {};
        if (JSON.stringify(spk) !== JSON.stringify(e.speakers || {})) { e.speakers = spk; dirty = true; }
        if (src.category && src.category !== e.category) { e.category = src.category; dirty = true; }
      }
      if (dirty) {
        const list = $("#list");
        const st = list.scrollTop;
        renderSide(); renderList();
        list.scrollTop = st;
      }
    })
    .catch(() => {});
  setInterval(sync, 30000);
}

renderSide();
renderList();
</script>
</body>
